# Gitea Actions (act_runner): test, build the x86-64 image, and publish it to this Gitea server's
# container registry from main / version tags. Branch pushes only test and build.
#
# One-time setup (see docs/DEPLOY.md → Gitea):
#   Repo → Settings → Actions → Secrets → add REGISTRY_TOKEN = a Gitea access token with "write:package".
# Gitea uses this folder instead of .github/workflows when both exist.
name: docker
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build image
        run: docker build -t manna:ci .
      - name: Publish image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY="${GITHUB_SERVER_URL#*://}"
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="$REGISTRY/$OWNER/manna"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          docker tag manna:ci "$IMAGE:latest"
          docker tag manna:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Published $IMAGE:latest"
